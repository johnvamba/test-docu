name: ${COMPOSE_PROJECT_NAME:-ajaia-docs}

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: ${COMPOSE_PROJECT_NAME:-ajaia-docs}-php
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    composer:
      condition: service_completed_successfully
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  # One-shot: keeps the vendor volume in sync with composer.lock before PHP starts.
  composer:
    <<: *php
    command: composer install --no-interaction --no-progress --optimize-autoloader
    depends_on: {}
    restart: "no"

  app:
    <<: *php

  queue:
    <<: *php
    # Dev: queue:listen reloads code on every job.
    # Prod: queue:work --max-time=3600 (see docker/prod).
    command: php artisan queue:listen redis --sleep=1 --tries=3 --timeout=90

  scheduler:
    <<: *php
    command: php artisan schedule:work

  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    restart: unless-stopped

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ${COMPOSE_PROJECT_NAME:-ajaia-docs}-node
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  vendor:
  node_modules: